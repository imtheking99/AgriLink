<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AgriLink Weather</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            font-family: 'Poppins', sans-serif; color: #ffffff;
            /* Moving Gradient Background */
            background: linear-gradient(-45deg, #1a2a6c, #b21f1f, #fdbb2d, #00c6ff);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Navigation Bar */
        .nav-bar { 
            width: 100%; padding: 30px 50px; display: flex; justify-content: space-between; 
            align-items: center; box-sizing: border-box;
        }
        .nav-links a { 
            color: white; text-decoration: none; margin-left: 15px; font-size: 0.85rem; 
            padding: 10px 20px; border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50px; backdrop-filter: blur(10px); background: rgba(255,255,255,0.1);
            transition: 0.3s;
        }
        .nav-links a:hover { background: white; color: #333; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        /* Glass Container */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            margin-top: 20px;
        }

        .title { font-size: 0.8rem; font-weight: 600; letter-spacing: 5px; opacity: 0.8; text-transform: uppercase; margin-bottom: 20px; }
        .temp { font-size: 7rem; font-weight: 600; line-height: 1; margin: 10px 0; }
        .city { font-size: 1.5rem; font-weight: 400; margin-bottom: 5px; }
        .desc { font-size: 0.9rem; opacity: 0.9; text-transform: uppercase; letter-spacing: 2px; }

        /* Alert Box */
        .alert-box { 
            background: rgba(255, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px; border-radius: 15px; margin-top: 25px; font-size: 0.85rem;
        }

        /* Form */
        form { margin-top: 40px; display: flex; justify-content: center; gap: 10px; }
        input { 
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); 
            padding: 12px 20px; border-radius: 50px; color: white; width: 60%; outline: none; text-align: center;
        }
        .search-btn { 
            background: white; color: #333; border: none; padding: 12px 25px; 
            border-radius: 50px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .search-btn:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <!-- Nav Bar -->
    <div class="nav-bar">
        <a href="/" style="padding: 10px 20px; border: 1px solid rgba(255,255,255,0.3); border-radius: 50px; text-decoration: none; color: white; font-size: 0.8rem; background: rgba(255,255,255,0.1);">← BACK</a>
        <div class="nav-links">
            <a href="/home/">Dashboard</a>
            <a href="/crops/">Crops</a>
            <a href="/profile/">Profile</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="glass-card">
        <div class="title">AgriLink Weather</div>
        
        {% if weather %}
            <div class="temp">{{ weather.main.temp|floatformat:0 }}°</div>
            <div class="city">{{ weather.name }}</div>
            <div class="desc">{{ weather.weather.0.description }} | HUMIDITY {{ weather.main.humidity }}%</div>
            
            {% if alerts %}
                <div class="alert-box">⚠️ ALERT: {{ alerts.0 }}</div>
            {% endif %}
        {% else %}
            <div class="city" style="margin-bottom: 20px;">ENTER LOCATION</div>
        {% endif %}

        <form method="GET">
            <input type="text" name="city" placeholder="Search City..." required>
            <button type="submit" class="search-btn">SEARCH</button>
        </form>
    </div>

</body>
</html>
